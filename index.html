<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Upside Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.__errs=[];addEventListener("error",e=>__errs.push(e.message+" @ "+(e.filename||"").split("/").pop()+":"+e.lineno));</script>
<script src="js/build.js" onerror="window.BUILD={sha:'local',time:''}"></script>
</head>
<body>
<main class="shell">
  <div class="frame" id="frame">
    <canvas id="game" width="400" height="225"></canvas>

    <!-- HUB: outside the Hellfire Club -->
    <section class="panel hub" id="p-menu">
      <div class="hub-card">
        <h1 class="logo"><span class="up">THE UPSIDE</span> <span class="down">DOWN</span></h1>
        <p class="tag" data-i18n="tag"></p>
        <div class="who" id="who"></div>
        <div class="menu-grid">
          <button class="btn primary" data-go="play" data-i18n="menu.play"></button>
          <button class="btn" data-go="sheet" data-i18n="menu.sheet"></button>
          <button class="btn" data-go="upgrades" data-i18n="menu.upgrades"></button>
          <button class="btn" data-go="leaderboard" data-i18n="menu.leaderboard"></button>
          <button class="btn" data-go="settings" data-i18n="menu.settings"></button>
          <button class="btn" data-go="report" data-i18n="menu.report"></button>
        </div>
        <div class="menu-foot">
          <span class="bank"><i class="bulb"></i> <span data-i18n="lights"></span> <b id="bank">0</b></span>
          <span class="bank"><span data-i18n="best"></span> <b id="best">0</b></span>
        </div>
        <p class="keys" id="keys-hint"></p>
      </div>
    </section>

    <!-- CHARACTER SHEET -->
    <section class="panel hidden sheet-panel" id="p-sheet">
      <div class="sheet">
        <header class="ph"><h2 data-i18n="sheet.title"></h2><span class="bank"><i class="bulb"></i> <span data-i18n="lights"></span> <b class="bank-n">0</b></span></header>
        <div class="sheet-grid">
          <div class="sheet-left">
            <canvas id="preview" width="12" height="16"></canvas>
            <label class="field"><span data-i18n="sheet.name"></span> <input id="cname" maxlength="12" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:sheet.placeholder"></label>
            <div class="field"><span data-i18n="sheet.class"></span> <div class="classes" id="classes"></div></div>
            <div class="field"><span data-i18n="sheet.hair"></span> <div class="swatches" id="hair"></div></div>
            <div class="field"><span data-i18n="sheet.jacket"></span> <div class="swatches" id="jacket"></div></div>
          </div>
          <div class="sheet-right">
            <div class="abil" id="abil"></div>
            <p class="rollbar muted" data-i18n="sheet.growNote"></p>
            <dl class="derived" id="derived"></dl>
          </div>
        </div>
        <div class="menu-grid">
          <button class="btn primary" data-go="play" data-i18n="sheet.saveRun"></button>
          <button class="btn" data-go="menu" data-i18n="sheet.saveBack"></button>
        </div>
      </div>
    </section>

    <!-- UPGRADES -->
    <section class="panel hidden" id="p-upgrades">
      <header class="ph"><h2 data-i18n="up.title"></h2><span class="bank"><i class="bulb"></i> <span data-i18n="lights"></span> <b class="bank-n">0</b></span></header>
      <div class="list" id="up-list"></div>
      <button class="btn back" data-go="menu" data-i18n="back"></button>
    </section>

    <!-- LEADERBOARD -->
    <section class="panel hidden" id="p-leaderboard">
      <header class="ph"><h2 data-i18n="lb.title"></h2><span class="mode" id="lb-mode"></span></header>
      <ol class="board" id="lb-list"></ol>
      <button class="btn back" data-go="menu" data-i18n="back"></button>
    </section>

    <!-- SETTINGS -->
    <section class="panel hidden sheet-panel" id="p-settings">
      <div class="sheet settings">
        <header class="ph"><h2 data-i18n="set.title"></h2><button class="btn back" data-go="menu" data-i18n="back"></button></header>
        <div class="set-grid">
            <section class="set-card">
              <h3 data-i18n="set.sound"></h3>
              <div class="set-row"><span data-i18n="set.music"></span>
                <button class="btn tiny tog" id="s-music"></button>
                <input type="range" id="s-musicvol" min="0" max="1" step="0.05" data-i18n-attr="aria-label:set.volume"></div>
              <div class="set-row"><span data-i18n="set.sfx"></span>
                <button class="btn tiny tog" id="s-sfx"></button>
                <input type="range" id="s-sfxvol" min="0" max="1" step="0.05" data-i18n-attr="aria-label:set.volume"></div>
            </section>
            <section class="set-card">
              <h3 data-i18n="set.language"></h3>
              <div class="seg seg-lang" id="s-lang"></div>
            </section>
            <section class="set-card">
              <h3 data-i18n="set.display"></h3>
              <div class="set-row"><span data-i18n="set.fullscreen"></span><button class="btn tiny tog" id="fs"></button></div>
              <div class="set-row inline"><span data-i18n="set.touch"></span><div class="seg seg-fill" id="s-touch"></div></div>
            </section>
            <section class="set-card set-controls">
              <div class="ctl-head">
                <h3 data-i18n="set.keys"></h3>
                <div class="tabs" role="tablist">
                  <button class="btn tiny tab on" id="tab-key" role="tab" data-tab="key" data-i18n="set.keyboard"></button>
                  <button class="btn tiny tab" id="tab-pad" role="tab" data-tab="pad" data-i18n="set.controller"></button>
                </div>
              </div>
              <table class="binds">
                <thead><tr><th data-i18n="set.action"></th><th data-i18n="set.primary"></th><th data-i18n="set.secondary"></th></tr></thead>
                <tbody id="s-binds"></tbody>
              </table>
              <p class="muted small" id="s-pad"></p>
              <button class="btn tiny" id="s-reset" data-i18n="set.reset"></button>
            </section>
        </div>
      </div>
    </section>

    <!-- PAUSE -->
    <section class="panel hidden" id="p-pause">
      <h2 data-i18n="pause.title"></h2>
      <div class="menu-grid">
        <button class="btn primary" data-go="resume" data-i18n="pause.resume"></button>
        <button class="btn" data-go="settings" data-i18n="menu.settings"></button>
        <button class="btn" data-go="report" data-i18n="menu.report"></button>
        <button class="btn" data-go="quit" data-i18n="pause.quit"></button>
      </div>
    </section>

    <!-- BUG / IDEA REPORTS -->
    <section class="panel hidden" id="p-report">
      <header class="ph"><h2 data-i18n="rep.title"></h2></header>
      <div class="rep-grid">
        <div class="rep-new">
          <img id="rep-shot" alt="">
          <div class="rep-kind">
            <button class="btn tiny on" data-kind="bug" data-i18n="rep.bug"></button>
            <button class="btn tiny" data-kind="idea" data-i18n="rep.idea"></button>
          </div>
          <textarea id="rep-text" rows="4" maxlength="2000" spellcheck="true" data-i18n-attr="placeholder:rep.ph"></textarea>
          <button class="btn primary" id="rep-save" data-i18n="rep.save"></button>
          <p class="muted rep-msg" id="rep-msg"></p>
        </div>
        <div class="rep-side">
          <h3 id="rep-count"></h3>
          <div class="rep-list" id="rep-list"></div>
          <div class="rep-actions">
            <button class="btn" id="rep-export" data-i18n="rep.export"></button>
            <button class="btn" id="rep-copy" data-i18n="rep.copy"></button>
            <button class="btn" id="rep-clear" data-i18n="rep.clear"></button>
          </div>
          <p class="muted rep-hint" data-i18n="rep.hint"></p>
        </div>
      </div>
      <button class="btn back" id="rep-back" data-i18n="back"></button>
    </section>

    <!-- GAME OVER -->
    <section class="panel hidden" id="p-over">
      <h2 class="over-t" data-i18n="over.title"></h2>
      <div class="over-row">
        <div class="stats" id="over-stats"></div>
        <div class="dicebox" id="over-dice" hidden>
          <h3 data-i18n="dice.title"></h3>
          <p class="muted" id="dice-left"></p>
          <div class="d20" id="d20"><span>?</span></div>
          <div class="dice-res" id="dice-res"></div>
          <button class="btn primary" id="dice-roll"></button>
        </div>
      </div>
      <p class="muted" id="over-lb"></p>
      <div class="menu-grid">
        <button class="btn primary" data-go="play" data-i18n="over.again"></button>
        <button class="btn" data-go="upgrades" data-i18n="menu.upgrades"></button>
        <button class="btn" data-go="report" data-i18n="menu.report"></button>
        <button class="btn" data-go="menu" data-i18n="pause.quit"></button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

  <div class="touch" id="touch">
    <div class="tg"><button data-k="roll" data-i18n="touch.roll"></button><button data-k="jump" data-i18n="touch.jump"></button></div>
    <div class="tg"><button data-k="attack" data-i18n="touch.attack"></button><button data-k="flip" data-i18n="touch.flip"></button></div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/scenery.js"></script>
<script src="js/game.js"></script>
<script src="js/report.js"></script>
<script src="js/ui.js"></script>
<script src="js/debug.js"></script>
</body>
</html>
