# Every push to main: publish the game to GitHub Pages. About a minute.
# No build step: the site is plain HTML/JS, copied into _site as-is.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: # changes that don't affect the game skip the deploy
      - '**.md'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build: # collect the site and upload it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html css js assets fonts _site/
          touch _site/.nojekyll
          # build stamp shown in the F9 debug panel
          echo "window.BUILD={sha:\"$GITHUB_SHA\",time:\"$(date -u +'%Y-%m-%d %H:%M UTC')\"};" > _site/js/build.js
      - uses: actions/configure-pages@v5
        continue-on-error: true # turns Pages on if the token may; otherwise set Source = GitHub Actions once
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy: # separate job, as GitHub recommends: the upload is registered by the time it runs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
